# Crystallizer branched-rollout GRPO smoke test.
#
# Tiny sizing so the full loop (train → save → merge → eval) completes
# end-to-end on an L4 in ~15-25 min. Goal: verify the pipeline runs and
# the W&B orchestrator gets at least one outer-iter row. NOT a learning-
# quality run.
#
# Sizing vs configs/loop_grpo_branched_crystallizer.yaml:
#   loop.iterations         23  ->  1   (one full outer cycle is enough)
#   branched.g1,g2           4  ->  2   (16 trajectories/step -> 4)
#   branched.max_turn_tokens 400 -> 400 (matched to the full config)
#   train tasks              24 ->  2   (one limit near each end of the range)
#   per_device_train_batch   16 ->  4   (= g1 * g2)
#
# Net: max_steps/outer = 2, total = 2 inner steps + 1 eval pass.
#
# Why max_turn_tokens=400: matches the full config so the smoke exercises
# realistic generation lengths. T<<400 leaves the model hitting
# EOS-by-truncation mid-statement, and with
# `mask_truncated_completions: true` those rollouts get masked out of the
# loss — so we'd be testing pipeline plumbing without any learning signal.
# Memory at smoke sizing: B=pdtbs=4 (one branched tree per step), so the
# LM-head gradient tensor is ≈ 4 × 400 × |V| × 4B ≈ 0.97 GiB.

base_model:
  # Documentation only — the actual model id is read by 00_setup_env.sh
  # from the LORA4VR_BASE_MODEL env var (default Qwen/Qwen3-4B-Instruct-2507).
  hf: "Qwen/Qwen3-4B-Instruct-2507"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "scripts/seed_tasks/crystallizer_smoke_train.jsonl"
  tasks_eval: "scripts/seed_tasks/crystallizer_eval.jsonl"

loop:
  iterations: 1
  trainer: "grpo_branched"

branched:
  g1: 2
  g2: 2
  max_turn_tokens: 400

grpo:
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.0
  loss_type: "dapo"
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: true
  log_completions: true

generation:
  n_samples_per_task: 4
  temperature: 0.8
  top_p: 0.95
  max_tokens: 600

# Same horizon as the full config: a slow but safe batch needs close to the
# env's 600-step limit, and the smoke must not cut it short.
scoring:
  timeout_seconds: 30
  max_steps: 600

eval:
  n_turns: 2

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 4   # = g1 * g2
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: "wandb"
  wandb_project: "lora4vr"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 8
  alpha: 16
  dropout: 0.05
  task_type: "CAUSAL_LM"

# Multi-turn prompt. The format example shows fences and mode directives only
# ("format"). With the original example ("full": reset and print the state) the
# frozen model copied it in 80-83 of 96 probe runs; with no example ("none") it
# never took the probe turn and dropped the fences (Stage 2 ablation, 2026-10-26).
prompt:
  example: format
