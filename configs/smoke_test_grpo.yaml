base_model:
  hf: "Qwen/Qwen2.5-Coder-3B-Instruct"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "data/tasks/train.jsonl"
  tasks_eval: "data/tasks/eval.jsonl"

loop:
  iterations: 1
  trainer: "grpo"

grpo:
  num_generations: 4
  num_iterations: 1
  epsilon: 0.2
  beta: 0.0
  loss_type: "dapo"
  scale_rewards: "group"
  max_completion_length: 300
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: false
  log_completions: false

scoring:
  timeout_seconds: 15
  max_steps: 200

training:
  learning_rate: 5.0e-6
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 8
  alpha: 16
  dropout: 0.05
  task_type: "CAUSAL_LM"
