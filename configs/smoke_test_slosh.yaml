# Slosh branched-rollout GRPO smoke test.
#
# Tiny sizing so the full loop (train → save → merge → eval) completes
# end-to-end on an L4 in ~15-25 min. Goal: verify the pipeline runs and
# the W&B orchestrator gets at least one outer-iter row. NOT a learning-
# quality run.
#
# Sizing vs configs/loop_grpo_branched_slosh.yaml:
#   loop.iterations         23  ->  1   (one full outer cycle is enough)
#   branched.g1,g2           4  ->  2   (16 trajectories/step -> 4)
#   branched.max_turn_tokens 400 -> 100 (quartered generation budget)
#   train tasks              24 ->  2   (κ extremes, same seed; see jsonl)
#   per_device_train_batch   16 ->  4   (= g1 * g2)
#
# Net: max_steps/outer = 2, total = 2 inner steps + 1 eval pass.
#
# Why max_turn_tokens=100 specifically: at smoke sizing TRL's RepeatSampler
# puts g1*g2 = 4 replicated rows in `generate_and_score`, expanding to
# 16 trajectories in the backward pass (the trainer's branched fan-out per
# row). The dominant memory term is the LM-head cross-entropy gradient
# tensor at turn-2's backward, ≈ 16 × T × |V| × 4B ≈ 0.97 GiB at T=100
# (vs 1.95 GiB at T=200, which OOMed on L4 with Qwen3-4B). 100 tokens is
# enough for a minimal probe + a short PD policy; tighten to 80 if even
# that doesn't fit, or raise toward 200 on A100-40GB+.

base_model:
  # Documentation only — the actual model id is read by 00_setup_env.sh
  # from the LORA4VR_BASE_MODEL env var (default Qwen/Qwen3-4B-Instruct-2507).
  hf: "Qwen/Qwen3-4B-Instruct-2507"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "scripts/seed_tasks/slosh_smoke_train.jsonl"
  tasks_eval: "scripts/seed_tasks/slosh_eval.jsonl"

loop:
  iterations: 1
  trainer: "grpo_branched"

branched:
  g1: 2
  g2: 2
  max_turn_tokens: 100

grpo:
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.0
  loss_type: "dapo"
  scale_rewards: "batch"
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: true
  log_completions: true

generation:
  n_samples_per_task: 4
  temperature: 0.8
  top_p: 0.95
  max_tokens: 600

scoring:
  timeout_seconds: 15
  max_steps: 200

eval:
  n_turns: 2

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 4   # = g1 * g2
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: "wandb"
  wandb_project: "lora4vr"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 8
  alpha: 16
  dropout: 0.05
  task_type: "CAUSAL_LM"
