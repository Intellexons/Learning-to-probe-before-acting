base_model:
  hf: "Qwen/Qwen2.5-Coder-3B-Instruct"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  dpo_dir: "data/dpo"
  tasks_train: "data/tasks/train.jsonl"
  tasks_eval: "data/tasks/eval.jsonl"

loop:
  iterations: 1

generation:
  n_samples_per_task: 4
  temperature: 0.8
  top_p: 0.95
  max_tokens: 300

scoring:
  timeout_seconds: 15
  max_steps: 200

dpo_pairs:
  min_chosen_reward: 0.0
  pairs_per_task: 2

training:
  beta: 0.1
  learning_rate: 5.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  max_length: 2048
  max_prompt_length: 1536
  warmup_ratio: 0.1
  bf16: false
  fp16: true
  gradient_checkpointing: true
  logging_steps: 1
  loss_type: "sigmoid"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 8
  alpha: 16
  dropout: 0.05
  task_type: "CAUSAL_LM"
