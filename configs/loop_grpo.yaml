base_model:
  hf: "Qwen/Qwen2.5-Coder-3B-Instruct"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "data/tasks/train.jsonl"
  tasks_eval: "data/tasks/eval.jsonl"

loop:
  iterations: 30
  trainer: "grpo"

grpo:
  num_generations: 8         # completions per prompt (G). Halved from 16 for L4 memory.
  num_iterations: 1          # mu: policy mini-batches per generation batch
  epsilon: 0.2               # clipping param (lower bound)
  epsilon_high: 0.28         # DAPO asymmetric upper clip
  beta: 0.0                  # KL coefficient (0.0 = no KL penalty)
  loss_type: "dapo"          # "dapo", "grpo", "dr_grpo", "bnpo", "cispo", "sapo"
  scale_rewards: "batch"     # DAPO: avoid group-level normalization (difficulty bias)
  max_completion_length: 600 # max tokens per completion. Trimmed from 900 for L4 memory.
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: true  # DAPO Overlong Filtering
  log_completions: true

generation:
  n_samples_per_task: 8
  temperature: 0.8
  top_p: 0.95
  max_tokens: 600

scoring:
  timeout_seconds: 30
  max_steps: 500

training:
  learning_rate: 1.0e-5
  per_device_train_batch_size: 8  # Must match num_generations for GRPO.
  gradient_accumulation_steps: 1
  num_train_epochs: 4
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: "wandb"
  wandb_project: "lora4vr"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 16
  alpha: 32
  dropout: 0.05
  task_type: "CAUSAL_LM"
