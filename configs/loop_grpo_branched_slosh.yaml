base_model:
  # Documentation only — the actual model id is read by 00_setup_env.sh
  # from the LORA4VR_BASE_MODEL env var (default Qwen/Qwen3-4B-Instruct-2507).
  # Keep this in sync with the env-var default.
  hf: "Qwen/Qwen3-4B-Instruct-2507"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "scripts/seed_tasks/slosh_train.jsonl"
  tasks_eval: "scripts/seed_tasks/slosh_eval.jsonl"

loop:
  iterations: 23
  trainer: "grpo_branched"

# Branched-rollout (VinePPO-style) sizing. Total trajectories per prompt
# is g1 * g2. Per the design doc, start with g1=g2=4 (16 trajectories,
# ~20 LLM forward calls — saves ~40% compute over flat G=16, N=2).
branched:
  g1: 4
  g2: 4
  max_turn_tokens: 400
  # Split each per-turn forward+backward along the row dim. Shrinks the
  # (B, K, |V|) logits/gradient tensors linearly with this value while
  # keeping the gradient identity (sum of chunk losses == single-pass loss
  # because num_items_in_batch is the global token count, passed unchanged
  # to every chunk).
  #
  # Required on 24 GB L4: empirical run `dedup-prod-l4` (2026-05-15) OOMed
  # at the turn-2 `logits / temperature` allocation — 3.9 GiB tensor +
  # 3.9 GiB transient duplicate. At mb=4 the per-chunk forward holds
  # (4, 400, |V|) ≈ 0.97 GiB, recovering ~6 GiB of headroom. Cost: 4x
  # LM-head kernel launches per turn (~5% wall-clock).
  #
  # On A100-40GB+ this is unnecessary — leave it set since the gradient
  # is identical regardless of chunk size.
  loss_micro_batch_size: 4

grpo:
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.0
  loss_type: "dapo"
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: true
  log_completions: true

generation:
  n_samples_per_task: 8
  temperature: 0.8
  top_p: 0.95
  max_tokens: 600

scoring:
  timeout_seconds: 30
  max_steps: 500

# End-of-iteration eval (scripts/08_eval.py). Multi-turn rollouts match
# the training protocol so the W&B reward curve reflects what the trainer
# is actually optimising. The last `# MODE: policy` block in the rollout
# is the one scored; final-turn `# MODE: main` is rejected.
eval:
  n_turns: 2

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 16    # = g1 * g2 — one prompt's worth of trajectories per step
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: "wandb"
  wandb_project: "lora4vr"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 16
  alpha: 32
  dropout: 0.05
  task_type: "CAUSAL_LM"
