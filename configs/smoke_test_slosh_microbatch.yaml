# L4 smoke test for `branched.loss_micro_batch_size` (PR #62).
#
# Mirrors production sizing from `configs/loop_grpo_branched_slosh.yaml`
# (g1=g2=4, max_turn_tokens=400, pdtbs=16) — the config that previously
# OOM'd on a 24 GiB L4 — but caps `loop.iterations` to 1 so the run
# completes in ~30-45 min instead of overnight.
#
# Expected effect: per paper Appendix A Table 2, the per-turn LM-head
# gradient tensor at B=16, T=400, |V|≈152k is ≈ 3.9 GiB. With
# loss_micro_batch_size=4 the peak chunk drops to ≈ 1.0 GiB. Watch the
# W&B series `mem/peak_turn1_gib`, `mem/peak_turn2_gib`,
# `mem/peak_step_gib` — these should sit around 1-1.5 GiB instead of
# ~4 GiB. If the run still OOMs, drop mb to 2 (then 1) before touching
# any other dial.

base_model:
  hf: "Qwen/Qwen3-4B-Instruct-2507"

paths:
  hf_base_dir: "models/hf_base"
  lora_dir: "models/lora"
  rollouts_dir: "data/rollouts"
  tasks_train: "scripts/seed_tasks/slosh_train.jsonl"
  tasks_eval: "scripts/seed_tasks/slosh_eval.jsonl"

loop:
  iterations: 1
  trainer: "grpo_branched"

branched:
  g1: 4
  g2: 4
  max_turn_tokens: 400
  loss_micro_batch_size: 4   # the knob under test

grpo:
  num_iterations: 1
  epsilon: 0.2
  epsilon_high: 0.28
  beta: 0.0
  loss_type: "dapo"
  scale_rewards: "batch"
  temperature: 0.8
  top_p: 0.95
  mask_truncated_completions: true
  log_completions: true

generation:
  n_samples_per_task: 8
  temperature: 0.8
  top_p: 0.95
  max_tokens: 600

scoring:
  timeout_seconds: 30
  max_steps: 500

eval:
  n_turns: 2

training:
  learning_rate: 1.0e-4
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  num_train_epochs: 1
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 1
  report_to: "wandb"
  wandb_project: "lora4vr"

lora:
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  r: 16
  alpha: 32
  dropout: 0.05
  task_type: "CAUSAL_LM"
